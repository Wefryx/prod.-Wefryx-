<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEFRYX — Оставить отзыв</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body><div class="noise"></div>
<header class="header container"><a class="brand" href="index.html">WEFRYX</a><a class="header-cta" href="index.html#reviews">← ОТЗЫВЫ</a></header>
<main class="review-page container">
  <div class="review-form-wrap">
    <div class="eyebrow">WEFRYX PRODUCTION</div>
    <h1>ОСТАВЬТЕ <em>ОТЗЫВ</em></h1>
    <p class="form-intro">Расскажите о работе — это поможет нам становиться лучше.</p>
    <form id="review-form" class="review-form">
      <label>ПСЕВДОНИМ<input id="nickname" name="nickname" type="text" maxlength="40" placeholder="Например: Андрей В." required></label>
      <label>ТИП РАБОТЫ<select id="service_type" name="service_type" required><option value="" selected disabled>Выберите тип работы</option><option value="reels">Монтаж Reels / короткого видео</option><option value="long_video">Монтаж длинного видео</option><option value="commercial">Рекламный / брендовый монтаж</option><option value="motion">Моушен-дизайн</option></select></label>
      <fieldset><legend>ОЦЕНКА</legend><div class="rating" role="radiogroup" aria-label="Оценка от 1 до 5">
        <input id="star5" type="radio" name="rating" value="5"><label for="star5" title="5 звёзд">★</label>
        <input id="star4" type="radio" name="rating" value="4"><label for="star4" title="4 звезды">★</label>
        <input id="star3" type="radio" name="rating" value="3"><label for="star3" title="3 звезды">★</label>
        <input id="star2" type="radio" name="rating" value="2"><label for="star2" title="2 звезды">★</label>
        <input id="star1" type="radio" name="rating" value="1"><label for="star1" title="1 звезда">★</label>
      </div></fieldset>
      <label>ВАШ ОТЗЫВ<textarea id="review_text" name="review_text" maxlength="1000" rows="7" placeholder="Напишите, что вам понравилось в работе..." required></textarea></label>
      <button class="button button-light submit-review" type="submit">ОТПРАВИТЬ ОТЗЫВ <span>➤</span></button>
      <p id="review-status" class="status"></p>
      <p class="privacy-note">После отправки отзыв проходит проверку и появляется на сайте после публикации.</p>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="review.js"></script>
</body></html>
