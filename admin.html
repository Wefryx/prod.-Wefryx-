<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEFRYX — Управление портфолио</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh}.admin{max-width:720px;margin:50px auto;padding:25px}.box{border:1px solid #292929;border-radius:8px;padding:22px;margin-bottom:18px;background:#070707}label{display:block;font-size:11px;color:#aaa;margin:13px 0 7px}input,select{width:100%;padding:12px;background:#0b0b0b;border:1px solid #333;color:#eee;border-radius:5px}button{cursor:pointer}.admin-btn{width:100%;padding:13px;border:1px solid #555;border-radius:5px;background:#eee;color:#111;font-weight:800;margin-top:15px}.danger{background:#160b08;color:#ff8060;border-color:#5c2116}.status{font-size:11px;color:#aaa;line-height:1.5}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #222;padding:12px;margin-top:8px;border-radius:5px}.item small{color:#888}.item button{padding:7px 10px}.item>div:last-child{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.top a{font-size:11px;color:#aaa}</style></head>
<body><main class="admin"><div class="top"><div class="brand">WEFRYX</div><a href="index.html">← На сайт</a></div>
<div id="login" class="box"><h2>Вход</h2><p class="status">Только ты должен иметь аккаунт в Supabase Auth.</p><label>Email</label><input id="email" type="email"><label>Пароль</label><input id="password" type="password"><button class="admin-btn" id="loginBtn">ВОЙТИ</button><p id="loginStatus" class="status"></p></div>
<div id="manager" class="hidden"><div class="box"><h2>Добавить видео</h2><label>Видео</label><input id="file" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov"><label>Раздел</label><select id="category"><option value="short">Рилс / короткое видео</option><option value="long">Длинное видео</option></select><label>Название</label><input id="title" placeholder="Например: Бренд фильм для компании"><label>Длительность</label><input id="duration" placeholder="18:30"><button class="admin-btn" id="uploadBtn">ЗАГРУЗИТЬ В ПОРТФОЛИО</button><p id="uploadStatus" class="status"></p></div>
<div class="box"><h2>Мои видео</h2><div id="items"></div></div><div class="box"><h2>Отзывы</h2><p class="status">Новые отзывы сначала попадают сюда на проверку.</p><div id="review-items"></div></div><button class="admin-btn danger" id="logoutBtn">ВЫЙТИ</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
